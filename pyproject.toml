[project]
name = "nn-utils"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
pytorch-cpu = [
    "torch==2.14.0",
    "torchvision==0.29.0",
]
pytorch-macos = [
    "torch==2.14.0 ; sys_platform == 'darwin'",
    "torchvision==0.29.0 ; sys_platform == 'darwin'",
]
pytorch-linux-cuda = [
    "torch==2.14.0 ; sys_platform == 'linux'",
    "torchvision==0.29.0 ; sys_platform == 'linux'",
]
pytorch-windows-cuda = [
    "torch==2.14.0 ; sys_platform == 'win32'",
    "torchvision==0.29.0 ; sys_platform == 'win32'",
]

[dependency-groups]
basic = [
    "h5py>=3.15,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.7,<2",
    "tqdm>=4.67,<5",
]
test = [
    { include-group = "basic" },
    "matplotlib>=3.10,<4",
    "pytest>=9,<10",
    "pyvista>=0.47,<1",
    "seaborn>=0.13,<1",
]
[tool.uv]
package = false
default-groups = ["basic"]
conflicts = [
    [
        { extra = "pytorch-cpu" },
        { extra = "pytorch-macos" },
        { extra = "pytorch-linux-cuda" },
        { extra = "pytorch-windows-cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "pytorch-cpu" },
    { index = "pytorch-cpu", extra = "pytorch-macos" },
    { index = "pytorch-cu132", extra = "pytorch-linux-cuda" },
    { index = "pytorch-cu132", extra = "pytorch-windows-cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "pytorch-cpu" },
    { index = "pytorch-cpu", extra = "pytorch-macos" },
    { index = "pytorch-cu132", extra = "pytorch-linux-cuda" },
    { index = "pytorch-cu132", extra = "pytorch-windows-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["src/accuracy_metrics.py", "src/file_handling.py", "src/training_callbacks.py", "tests"]
